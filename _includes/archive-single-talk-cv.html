{% include base_path %}
<li class="cv-entry">
  <a href="{{ base_path }}{{ post.url }}">{{ post.title | strip }}</a>.
  {% if post.venue %}<em>{{ post.venue | strip }}</em>{% endif %}{% if post.location %}, {{ post.location | strip }}{% endif %}{% if post.date %}, {{ post.date | date: "%Y" }}{% endif %}.
</li>
